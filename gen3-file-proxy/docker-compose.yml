version: '3.8'

services:
  gen3-file-proxy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gen3-file-proxy
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - GEN3_API_URL=${GEN3_API_URL}
      - GEN3_FILE_DOWNLOAD_ENDPOINT=${GEN3_FILE_DOWNLOAD_ENDPOINT:-/user/data/download}
      - HOST=0.0.0.0
      - PORT=8000
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000}
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-100}
      - ENABLE_PROMETHEUS_METRICS=${ENABLE_PROMETHEUS_METRICS:-false}
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - gen3-network

networks:
  gen3-network:
    driver: bridge
